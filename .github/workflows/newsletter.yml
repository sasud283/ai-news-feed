name: Newsletter billing and delivery
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
permissions:
  contents: read
concurrency:
  group: newsletter-delivery
  cancel-in-progress: false
jobs:
  newsletter:
    if: vars.NEWSLETTER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NEWSLETTER_LINK_SECRET: ${{ secrets.NEWSLETTER_LINK_SECRET }}
      NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM }}
      NEWSLETTER_REPLY_TO: ${{ vars.NEWSLETTER_REPLY_TO }}
      NEWSLETTER_SITE_URL: ${{ vars.NEWSLETTER_SITE_URL }}
      NEWSLETTER_TEST_ONLY: 'true'
      NEWSLETTER_SEND_ENABLED: 'true'
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
      TMPDIR: ${{ github.workspace }}/.tmp
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p .tmp .cache
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r src/newsletter/requirements.txt
      - run: python -m src.newsletter.worker
